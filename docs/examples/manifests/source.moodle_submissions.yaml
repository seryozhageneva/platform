# Полный пример 2 из 3: блок-обёртка над инструментом MCP-сервера (runtime mcp).
id: source.moodle_submissions
version: 0.1.0
name: "Источник: работы из Moodle"
description: >-
  Получает сданные работы по заданию курса Moodle; черновики не берутся. Пока каждый
  запуск берёт все сданные работы задания: «только новые» появятся вместе с запуском
  по событию Moodle.
author: platform
category: source
kind: auto

inputs:
  - name: event
    title: Событие запуска
    type: Event
    required: false

outputs:
  # Чья это работа — номер студента в Moodle в meta.moodle_user_id; student_id пуст,
  # студент Moodle не ученик платформы. Имён из профиля Moodle в данных нет.
  - name: works
    title: Сданные работы
    type: File
    list: true

config:
  type: object
  required: [course_id, assignment_id]
  properties:
    course_id:
      title: Курс
      type: integer
    assignment_id:
      title: Задание
      type: integer

outcomes: [ok, empty]

# Ядро вызывает инструмент get_submissions сервера moodle как обычную функцию.
# Адрес сервера и ключ берутся из подключения преподавателя, в манифесте их нет.
runtime:
  type: mcp
  server: moodle
  tool: get_submissions

# Блок только читает: во внешнем мире ничего не меняется.
side_effects: false
