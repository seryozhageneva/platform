# Черновик: описание блока без кода.
id: sink.file
version: 0.1.0
name: "Получатель: файл"
description: Выгружает результат файлом — PDF, DOCX или файл импорта вопросов Moodle.
author: platform
category: sink
inputs:
  - {name: content, title: Что выгрузить, type: Data, list: true}
outputs:
  - {name: file, title: Готовый файл, type: File}
config:
  type: object
  properties:
    format: {title: Формат, enum: [pdf, docx, moodle_xml], default: pdf}
runtime: {type: python, entrypoint: "blocks.sink.file:run"}
