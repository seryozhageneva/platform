# CI: автоматические проверки на каждый pull request и на каждое изменение main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Код: оформление, линтер, правила импортов, миграции, тесты.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # Тестам репозиториев нужна база. Она каждый раз новая и пустая.
      - name: Случайный пароль базы на один прогон
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
      - name: Установить библиотеки
        run: uv sync --locked
      - name: Оформление кода
        run: uv run ruff format --check .
      - name: Линтер
        run: uv run ruff check .
      - name: Правила импортов
        run: uv run lint-imports
      - name: Поднять PostgreSQL и Redis и дождаться готовности
        run: docker compose up -d --wait postgres redis
      - name: Применить миграции на чистой базе
        run: uv run alembic upgrade head
      - name: Собрать образ для проверки изоляции
        run: docker build -t platform-code-runner:local services/sandbox
      - name: Тесты
        env:
          PLATFORM_TEST_DOCKER: "1"
        run: uv run pytest
      - name: Остановить базу
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend api:check
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build

  # Сервисы: база и очередь поднимаются командой docker compose up.
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Случайный пароль базы на один прогон
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
      - name: Поднять сервисы и дождаться готовности
        run: docker compose up -d --wait
      - name: Показать состояние
        run: docker compose ps
      - name: Остановить
        if: always()
        run: docker compose down -v

  # Платформа для сервера (ADR 0030): образы собираются, все контейнеры запускаются за Caddy,
  # сайт открывается по https://localhost. Модель — заглушка, данные — пустая база на один прогон.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Настройки на один прогон
        run: printf 'POSTGRES_PASSWORD=%s\nPLATFORM_DOMAIN=localhost\nLLM_PROVIDER=fake\n' "$(openssl rand -hex 16)" > .env
      - name: Собрать образ для программ учеников
        run: docker build -t platform-code-runner:local services/sandbox
      - name: Собрать образы и запустить платформу
        run: docker compose -f docker-compose.prod.yml up -d --build --wait
      - name: Проверить сайт
        run: |
          mkdir -p tmp
          docker compose -f docker-compose.prod.yml cp web:/data/caddy/pki/authorities/local/root.crt tmp/caddy-root.crt
          uv run python -m experiments.deploy_check https://localhost --ca-file tmp/caddy-root.crt
      - name: Журналы при ошибке
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 50
      - name: Остановить
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
