# Настройки Alembic — программы, которая ведёт миграции базы.
# Адреса базы и пароля здесь нет: они берутся из .env (см. backend/models/db.py).
# Применить миграции:  uv run alembic upgrade head
# Какая применена:     uv run alembic current

[alembic]
script_location = backend/models/migrations
prepend_sys_path = .
path_separator = os
# Имя файла миграции: номер и короткое название, например 0001_initial.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
