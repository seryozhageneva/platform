id: ai_process.generate
version: 0.2.0
name: ИИ-обработка
description: Готовит результат по шаблону промпта и схеме. В шаблон можно подставить {data} и {context}. Если разрешить инструменты, сам запрашивает недостающие данные, например журнал Moodle.
author: platform
category: ai_process
inputs:
  - {name: data, title: Исходные данные, type: Data}
  - {name: context, title: Дополнительные данные, type: Data, required: false}
outputs:
  - {name: result, title: Результат, type: Data, from_config: result}
config:
  type: object
  required: [prompt, result]
  additionalProperties: false
  properties:
    prompt: {title: Шаблон промпта, type: string, minLength: 1}
    result:
      title: Тип результата
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: {type: string, enum: [Data, Text, Task, Answer]}
        of: {title: Уточнение для Data, type: string}
        list: {title: Список, type: boolean, default: false}
    result_schema:
      title: Готовая схема результата
      type: string
      enum: [lecture_summary, lecture_tasks]
    model: {title: Модель, type: string}
    data_fields:
      # Модель видит только эти поля исходных данных. Так узел «Решить независимо»
      # получает условие задачи без эталона и решения.
      title: Какие поля исходных данных передать модели
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    # Агент (ADR 0035): какие инструменты из списка tools ниже разрешены этому узлу.
    tools:
      title: Какие инструменты разрешить
      type: array
      uniqueItems: true
      items: {type: string, enum: [moodle.get_course_grades]}
    max_steps:
      title: Сколько раз можно вызвать инструмент
      type: integer
      minimum: 1
      maximum: 10
      default: 5
    course_id:
      # Курс подставляется в каждый вызов поверх того, что попросила модель:
      # агент не заглянет в другой курс.
      title: Курс Moodle, который видит агент
      type: integer
  allOf:
    - if:
        required: [tools]
        properties:
          tools: {contains: {const: moodle.get_course_grades}}
      then:
        required: [course_id]
    - if:
        required: [result_schema]
        properties:
          result_schema: {const: lecture_summary}
      then:
        properties:
          result:
            required: [of]
            properties:
              type: {enum: [Data]}
              of: {enum: [summary]}
              list: {enum: [false]}
    - if:
        required: [result_schema]
        properties:
          result_schema: {const: lecture_tasks}
      then:
        properties:
          result:
            required: [list]
            properties:
              type: {enum: [Task]}
              list: {enum: [true]}
runtime: {type: python, entrypoint: "blocks.ai_process.generate:run"}
tools:
  - {server: moodle, tool: get_course_grades}
